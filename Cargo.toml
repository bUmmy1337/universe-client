[package]
name = "universe"
version = "0.2.0"
edition = "2021"
authors = ["universe contributors"]
description = "universe — native Windows VPN client for VLESS, VMess, Trojan, Shadowsocks and Hysteria2 subscriptions"
license = "MIT"
repository = "https://github.com/bUmmy1337/universe-client"
homepage = "https://github.com/bUmmy1337/universe-client"
readme = "README.md"
keywords = ["vpn", "sing-box", "vless", "hysteria2", "egui"]
categories = ["network-programming", "gui"]
build = "build.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false }
base64 = "0.22"
directories = "6"
earcutr = "0.4"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui_extras = { version = "0.32", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
lucide-static-svg = "1.46"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rs-grid-icons = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
window-vibrancy = "0.8"
zip = { version = "5", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
